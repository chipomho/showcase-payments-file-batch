# Shared development environment.
sftp:
  host: "mft.dev.internal"
  port: "22"
  username: "payments-feed"
  identityFile: "/opt/mule/keys/payments_feed_ed25519"
  knownHostsFile: "/opt/mule/keys/known_hosts"
  connectionTimeoutSeconds: "10"
  poll:
    frequencyMs: "300000"
    # A file must keep the same size across this interval before it is picked up, so a
    # partly uploaded file is never read.
    sizeCheckMs: "5000"
  dirs:
    inbound: "/inbound"
    outbound: "/outbound"
    archive: "/archive"
    error: "/error"
    duplicates: "/duplicates"
  reconnect:
    frequencyMs: "5000"
    attempts: "3"

db:
  host: "finance-db.dev.internal"
  port: "5432"
  database: "finance"
  user: "payments_loader"
  queryTimeoutSeconds: "30"
  pool:
    minSize: "1"
    maxSize: "10"
    maxWaitSeconds: "10"
  reconnect:
    frequencyMs: "2000"
    attempts: "3"

batch:
  blockSize: "200"
  commitSize: "200"
  maxConcurrency: "4"

objectStore:
  expiryIntervalMinutes: "60"
  # File names are remembered for longer than any sender would plausibly resend a file.
  processedFilesTtlDays: "400"
  runContextTtlDays: "7"
